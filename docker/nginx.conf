# Mockbench web container: serves the baked SPA and proxies the two API surfaces to the api service.
# One port serves BOTH the editor UI and the mock endpoints (/mock/...), so anyone who can reach the
# host on this port can use both. OPTIONS is deliberately NOT intercepted here: the api answers
# CORS preflights for /mock/* itself.

server {
  listen 80;
  listen [::]:80;
  server_name _;
  server_tokens off;

  # Project import accepts up to 10 MiB (API-CONTRACT 1.1); leave headroom for the JSON envelope.
  client_max_body_size 11m;

  # Docker's embedded DNS. Resolving `api` at request time (instead of once at start-up) means a
  # restarted or scaled api container is picked up within a few seconds instead of causing 502s.
  resolver 127.0.0.11 valid=5s ipv6=off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  root /usr/share/nginx/html;
  index index.html;

  # Shared proxy settings. `set $api` + a variable proxy_pass forces the runtime DNS lookup above and
  # passes the request URI through unchanged.
  set $api http://api:3000;

  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /mock/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Hashed build assets never change: cache them hard. index.html must always be revalidated so a new
  # deploy of the web image is picked up.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Everything else is a client-side route.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
