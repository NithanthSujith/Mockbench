name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mock
          POSTGRES_PASSWORD: mock
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mock -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mock:mock@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  lan-smoke:
    # FND-14: the compose stack comes up healthy and is reachable on the runner's NON-loopback address.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LAN_SMOKE_PORT: '8080'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mockbench/web exec playwright install --with-deps chromium
      - name: Cold start (also checks web waits for a healthy api)
        run: bash scripts/lan-smoke.sh up
      - name: Network, health, logs and image checks
        run: bash scripts/lan-smoke.sh check
      - name: Browser check at a host-resolver-mapped name
        run: bash scripts/lan-smoke.sh playwright
      - name: Database outage
        run: bash scripts/lan-smoke.sh outage
      - name: Print logs on failure
        if: failure()
        run: docker compose -p mockbench-lansmoke --env-file .env.example logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: bash scripts/lan-smoke.sh down
      - name: Two api containers against one empty database
        run: bash scripts/lan-smoke.sh scale
      - name: Tear down (scale)
        if: always()
        run: bash scripts/lan-smoke.sh down

  multiarch-build:
    # FND-14: both images build for linux/amd64 and linux/arm64 (nothing is pushed; REL-02 publishes).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  ownership:
    # Teams may only change files they own (docs/TEAMS.md 2.1). Applies to branches team/<team>/<SPEC-ID>.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'team/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check ownership
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git diff --name-only "$BASE_SHA"...HEAD > changed.txt
          xargs -d '\n' node scripts/check-ownership.mjs "$HEAD_REF" < changed.txt
