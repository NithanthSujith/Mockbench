name: codeql

# REL-03: CodeQL for JavaScript/TypeScript on PRs, on main and weekly.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - design-reference
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
